# Public product pages for the issuer probe (scripts/probe_issuers.py) and the
# collector's cross-check. One plain GET per page, robots.txt respected.
#
# `collect: true` means the probe (2026-09-26, GitHub Actions runner) found an
# offer sentence and/or annual fee this card's page states unambiguously, so the
# weekly collector fetches it to cross-check the bonuses API. `collect: false`
# pages were readable but not attributable (e.g. Amex bundles other cards'
# promos into page state), matched nothing, or 404'd; see docs/FINDINGS.md.

pages:
  - {issuer: chase, card_id: chase-sapphire-preferred, url: "https://creditcards.chase.com/rewards-credit-cards/sapphire/preferred", collect: true}
