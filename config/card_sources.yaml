# Where each tracked card's terms come from: the issuer's public product page.
#
# Used by:
# - the card-terms pipeline (card_agent/terms): fetch, hash, LLM-extract, validate,
#   and propose changes to config/card_details.yaml through a reviewed PR;
# - the weekly collector: pages with `cross_check: true` are also used to
#   cross-check the bonuses API's bonus and annual fee;
# - scripts/probe_issuers.py, which reports which pages are readable with one GET.
#
# Fields
#   issuer, name   the card as the prompt names it
#   url            the product page; null means "no working page": the card keeps
#                  its hand-maintained values and gets source_status "manual"
#   page_names     names the page may use for this card. The extraction is rejected
#                  unless the card name the model read off the page matches one of
#                  these after normalization (issuer names and words like "card",
#                  "credit", "rewards", "Visa Signature" are ignored). This is what
#                  stops a Delta promo on an Amex Gold page from being read as Gold.
#   cross_check    weekly bonus/fee cross-check in the collector (probe-verified)
#   manual_reason  why a card has no url
#
# Most URLs come from the bonuses API export; the 23 probed on 2026-09-26 are in
# docs/FINDINGS.md. To track another card, add it here and to card_details.yaml.

