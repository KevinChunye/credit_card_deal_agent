[project]
name = "credit-card-deal-agent"
version = "0.1.0"
description = "Personal agent that tracks US credit card sign-up bonuses and benefits, scores them against your wallet, and sends a monthly digest. Deterministic core driven by an OpenClaw skill."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
    "pandas>=2.1",
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "agentmail>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# ruff format owns line length; long regexes and URLs are fine.
ignore = ["E501"]
