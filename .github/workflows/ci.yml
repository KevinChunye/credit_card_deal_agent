name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The card-terms workflow dispatches CI on its auto PR's branch, because pushes
  # and PRs made with GITHUB_TOKEN don't trigger workflows.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Tests (offline)
        run: pytest -q
